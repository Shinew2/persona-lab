<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Persona Lab — clickable paper prototype</title>
<style>
:root{--ink:#111827;--muted:#657084;--line:#dce3ee;--blue:#1663f6;--navy:#101b34;--max:1160px}*{box-sizing:border-box}body{margin:0;font:15px/1.55 Inter,ui-sans-serif,system-ui,sans-serif;color:var(--ink);background:#fff}a{color:inherit}.top{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:24px;padding:16px max(24px,calc((100% - var(--max))/2));background:#fffffff2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:9px;margin-right:auto;font-size:18px;font-weight:800;letter-spacing:-.04em;text-decoration:none}.mark{display:grid;place-items:center;width:29px;height:29px;border-radius:8px;background:var(--blue);color:#fff}.top a:not(.brand){color:var(--muted);font-size:14px;text-decoration:none}.top a:hover,.top a[aria-current=page]{color:var(--ink)}.top .cta,.button{padding:10px 16px;border-radius:7px;background:var(--blue);color:#fff!important;font-weight:750}.helper{margin:0;padding:9px 20px;background:var(--navy);color:#dce6fc;text-align:center;font-size:12px}.helper a{color:#fff}.wrap{max-width:var(--max);margin:auto;padding:0 28px}.hero{display:grid;grid-template-columns:1fr .9fr;gap:62px;align-items:center;min-height:620px}.hero h1,h2{margin:0;line-height:.98;letter-spacing:-.07em}.hero h1{max-width:610px;font-size:clamp(48px,6vw,78px)}.lead{max-width:500px;margin:27px 0 30px;color:var(--muted);font-size:19px}.button{display:inline-block;text-decoration:none;box-shadow:0 9px 18px #1663f632;transition:.2s}.button:hover{background:#0753e5;transform:translateY(-2px)}.link{display:inline-block;margin-left:21px;font-weight:700}.visual{position:relative;min-height:410px}.slab{position:absolute;inset:25px 0 24px 72px;background:var(--blue)}.browser{position:absolute;top:0;left:0;width:86%;padding:18px;border:1px solid #ccd5e1;border-radius:9px;background:#fff;box-shadow:0 24px 40px #18213b20}.dots{height:18px;border-bottom:1px solid var(--line)}.dots:before{content:'● ● ●';color:#9da9b8;font-size:9px;letter-spacing:3px}.screen{display:grid;grid-template-columns:1fr .85fr;gap:15px;align-items:center;padding:28px 5px 4px}.bars:before{content:'';display:block;width:88%;height:13px;background:var(--navy);box-shadow:0 26px #dce3ec,0 39px #dce3ec,0 65px var(--blue)}.mini-image{height:118px;background:linear-gradient(135deg,#e4e9f1 52%,#cbd5e1 52%)}.note{position:absolute;right:-2px;bottom:0;width:198px;padding:15px;background:#fff;border:1px solid #d4dce7;border-radius:7px;box-shadow:0 14px 29px #18213b1c;transform:rotate(3deg)}.note img{float:left;width:41px;height:41px;margin:0 9px 6px 0;border-radius:5px;object-fit:cover}.note p{clear:both;margin:8px 0 0;font-size:12px}.arrow{position:absolute;right:164px;bottom:62px;color:var(--blue);font-size:47px}.disclosure{border-top:1px solid var(--line);padding:23px 0 76px;color:var(--muted);font-size:13px}.disclosure strong{color:var(--ink)}.process{border-top:1px solid var(--line);padding:98px 0}.head{display:flex;justify-content:space-between;gap:30px;align-items:end;margin-bottom:48px}.head h2,.proof h2,.team h2{font-size:clamp(34px,4.2vw,54px)}.head p{max-width:300px;margin:0;color:var(--muted)}.steps{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}.step{min-height:202px;padding:23px 30px 0 0;border-right:1px solid var(--line)}.step+.step{padding-left:30px}.step:last-child{border:0}.step b{color:var(--blue);font-size:13px}.step h3{margin:30px 0 8px;font-size:23px;letter-spacing:-.045em}.step p{max-width:260px;margin:0;color:var(--muted)}.proof{display:grid;grid-template-columns:.9fr 1.1fr;gap:65px;align-items:center;padding:100px max(28px,calc((100% - var(--max))/2));background:var(--navy);color:#fff}.proof p{max-width:440px;margin:23px 0 30px;color:#c6d0e7;font-size:17px}.proof .button{background:#fff;color:var(--navy)!important;box-shadow:none}.report{position:relative;min-height:350px}.page{position:absolute;width:67%;padding:24px;border-radius:5px;background:#fff;color:var(--ink);box-shadow:0 22px 44px #0004}.page:first-child{top:0;left:6%;transform:rotate(-3deg)}.page:last-child{right:0;bottom:8px;transform:rotate(4deg)}.page small{font-weight:800}.page h3{margin:17px 0;font-size:20px;letter-spacing:-.05em}.line{height:7px;margin:8px 0;background:#dde4ed}.line.short{width:58%}.block{height:85px;margin:16px 0;background:#eef2f7}.item{margin:10px 0;font-size:11px}.item:before{content:'●';margin-right:8px;color:var(--blue)}.team{padding:100px 0 25px}.people{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.person{border-top:1px solid var(--line);padding-top:17px}.person img{display:block;width:100%;height:235px;object-fit:cover;object-position:top;border-radius:5px;background:#f3f6fb}.person h3{margin:16px 0 1px;font-size:18px}.person p,.team p{margin:0;color:var(--muted)}.quotes{padding:88px 0 100px}.fine{margin:0 0 20px;color:var(--muted);font-size:12px}.quote-grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}.quote{display:flex;flex-direction:column;min-height:255px;padding:22px 19px 0 0;border-right:1px solid var(--line)}.quote+.quote{padding-left:19px}.quote:last-child{border:0}.quote-logo{width:120px;height:28px;object-fit:contain;object-position:left;filter:grayscale(1)}blockquote{margin:33px 0 0;font-size:16px;line-height:1.45}.character{width:42px;height:42px;object-fit:contain;margin-top:auto;align-self:flex-end}.support{display:flex;justify-content:space-between;align-items:center;gap:25px;padding:27px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--muted);font-size:13px}.support div{display:flex;gap:26px;flex-wrap:wrap}.support img{width:125px;max-height:27px;filter:grayscale(1)}footer{text-align:center;padding:31px;color:var(--muted);font-size:12px}.sheet-wrap{max-width:900px;margin:18px auto 40px;padding:0 18px}.sheet{position:relative}.sheet img{display:block;width:100%}.hotspot{position:absolute;display:block;border:2px solid transparent}.hotspot:hover,.hotspot:focus-visible{border-color:var(--blue);outline:2px dashed var(--blue);outline-offset:2px}@media(max-width:800px){.top{padding:14px 18px}.top a:not(.brand):not(.cta){display:none}.wrap{padding:0 22px}.hero{grid-template-columns:1fr;gap:38px;min-height:auto;padding:54px 0 50px}.hero h1{font-size:clamp(45px,13vw,64px)}.lead{font-size:17px}.visual{min-height:330px}.browser{width:88%}.note{width:175px}.arrow{right:144px;bottom:58px}.disclosure{padding-bottom:54px}.process,.team,.quotes{padding:67px 0}.head{display:block}.head p{margin-top:18px}.steps,.people,.quote-grid{grid-template-columns:1fr}.step,.step+.step,.quote,.quote+.quote{min-height:0;padding:21px 0;border-right:0;border-bottom:1px solid var(--line)}.proof{grid-template-columns:1fr;gap:38px;padding:67px 22px}.report{min-height:290px}.person{margin-bottom:27px}.quote blockquote{margin:23px 0}.character{margin-top:17px}.support{align-items:flex-start;flex-direction:column}.support div{gap:17px}.support img{width:104px}.link{display:block;margin:16px 0 0}}
</style>
<body><nav class="top" aria-label="Prototype pages"><a class="brand" href="#landing"><span class="mark">p</span>Persona Lab</a><a href="#landing" aria-current="page">How it works</a><a href="#results">Sample report</a><a class="cta" href="#workspace">Try the lab</a></nav><p class="helper"><a href="../index.html">Prepared assets + new brand logo</a> · <a href="../instructions.html">Workshop instructions</a></p><main id="preview"></main><footer>Concept preview · fictional content and synthetic sample results</footer>
<script>
const pages={workspace:{image:'workspace.png',alt:'Pencil sketch of Acme Market workspace showing six pages, a sample task, and recent activity.',links:[['landing','Return to landing page',5,4.5,28,4],['results','Open results',4,24.5,18,4],['results','View example results',28,57,33,5]]},results:{image:'results.png',alt:'Pencil sketch sample results with three journey steps and a possible friction finding. Synthetic example, not human research.',links:[['landing','Return to landing page',6,5,28,5],['workspace','Back to workspace',6,11,36,5],['workspace','Back to overview',6,89,42,6]]}};
const landing=`<section class="landing"><div class="wrap"><section class="hero"><div><h1>Meet your next product decision.</h1><p class="lead">Explore a product journey with simulated personas. Spot possible friction, ask better questions, and decide what to test with real people.</p><a class="button" href="#workspace">Explore a journey →</a><a class="link" href="#results">See a sample report →</a></div><div class="visual" aria-label="Product journey preview"><div class="slab"></div><div class="browser"><div class="dots"></div><div class="screen"><div class="bars"></div><div class="mini-image"></div></div></div><div class="arrow">→</div><article class="note"><img src="../characters/cat.png" alt=""><strong>First-time visitor</strong><p>“I want to understand which plan fits my team.”</p></article></div></section><p class="disclosure"><strong>Simulated-persona hypotheses, not validated human research.</strong> Every journey is a prompt to investigate, not a substitute for customer evidence.</p><section class="process"><div class="head"><h2>A clear path from perspective to evidence.</h2><p>Explore the connected prototype, then inspect the sample report with the right level of skepticism.</p></div><div class="steps"><article class="step"><b>01</b><h3>Set a perspective</h3><p>Begin with the context, constraints, and questions a particular user might bring.</p></article><article class="step"><b>02</b><h3>Follow the journey</h3><p>Give that persona a task and see the sequence of choices they make.</p></article><article class="step"><b>03</b><h3>Review evidence</h3><p>Use the observed path to identify possible friction and better research questions.</p></article></div></section></div><section class="proof"><div><h2>Make the next question more specific.</h2><p>Move from a simulated path to a concise report that keeps the evidence, the hypothesis, and the limits together.</p><a class="button" href="#results">Open the sample report →</a></div><div class="report"><article class="page"><small>PERSONA LAB</small><h3>Journey report</h3><div class="line"></div><div class="line short"></div><div class="block"></div><div class="item">Possible friction: plan comparison</div><div class="item">Evidence: 03:12 · pricing page</div></article><article class="page"><small>KEY TAKEAWAYS</small><h3>Evidence first.</h3><div class="item">Journey path</div><div class="item">Visible choice</div><div class="item">Research question</div></article></div></section><div class="wrap"><section class="team"><div class="head"><h2>Built for teams that stay curious.</h2><p>The Persona Lab crew is fictional, but their bias for examining the evidence is sincere.</p></div><div class="people"><article class="person"><img src="../characters/fox-ceo.png" alt="Felix Pivot, CEO and cofounder"><h3>Felix Pivot</h3><p>CEO &amp; cofounder</p></article><article class="person"><img src="../characters/codex-cto.png" alt="Codex McCompile, CTO and cofounder"><h3>Codex McCompile</h3><p>CTO &amp; cofounder</p></article><article class="person"><img src="../characters/dog-product.png" alt="Barkley Clicks, Head of Product"><h3>Barkley Clicks</h3><p>Head of Product</p></article></div></section><section class="quotes"><p class="fine">Fictional customers. Wildly fictional results.</p><div class="quote-grid"><article class="quote"><img class="quote-logo" src="../logos/acorn-commerce.svg" alt="Acorn Commerce"><blockquote>“Thanks to Persona Lab, conversions increased by 7 million percent. We’ve stopped checking the math.”</blockquote><img class="character" src="../characters/bear.png" alt=""></article><article class="quote"><img class="quote-logo" src="../logos/pawprint.svg" alt="Pawprint"><blockquote>“We finally built a product our users—and their agents—love.”</blockquote><img class="character" src="../characters/cat.png" alt=""></article><article class="quote"><img class="quote-logo" src="../logos/slow-steady.svg" alt="Slow &amp; Steady"><blockquote>“Persona Lab found our checkout friction in seconds. Our committee had been investigating since 2019.”</blockquote><img class="character" src="../characters/turtle.png" alt=""></article><article class="quote"><img class="quote-logo" src="../logos/tall-order.svg" alt="Tall Order"><blockquote>“Our customers are asking us to take their money. Finance is overwhelmed.”</blockquote><img class="character" src="../characters/giraffe.png" alt=""></article></div></section><section class="support"><span>Supported by fictional optimists</span><div><img src="../logos/placeholder-partners.svg" alt="Placeholder Partners"><img src="../logos/venture-maybe.svg" alt="Venture Maybe"><img src="../logos/hypothesis-fund.svg" alt="The Hypothesis Fund"></div></section></div></section>`;
function render(){let key=location.hash.slice(1);if(key!=='workspace'&&key!=='results')key='landing';document.querySelectorAll('.top a').forEach(a=>a.hash==='#'+key?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));if(key==='landing')preview.innerHTML=landing;else{const p=pages[key];preview.innerHTML='<div class="sheet-wrap"><div class="sheet"><img src="'+p.image+'" alt="'+p.alt+'">'+p.links.map(([t,l,x,y,w,h])=>'<a class="hotspot" href="#'+t+'" aria-label="'+l+'" style="left:'+x+'%;top:'+y+'%;width:'+w+'%;height:'+h+'%"></a>').join('')+'</div></div>'}scrollTo(0,0)}addEventListener('hashchange',render);render();
</script>
